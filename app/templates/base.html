<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{% block title %}Lextor{% endblock %}{% block title_suffix %} · Lee en cualquier idioma{% endblock %}</title>
  <meta name="description" content="{% block description %}Lextor convierte cualquier texto en una lectura bilingüe interactiva: traducción natural, glosas y notas gramaticales en cada fragmento. Funciona con Claude, ChatGPT y Gemini vía MCP.{% endblock %}" />
  <meta name="theme-color" content="#5b4cf0" />
  <script>
    /* theme before paint (no flash) */
    (function () { try { var t = localStorage.getItem("lextor.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {} })();
    window.__BP__ = {{ bp|tojson }};
    window.__ICONS__ = {{ icons_json|safe }};
  </script>
  <link rel="icon" type="image/svg+xml" href="{{ bp }}/static/favicon.svg" />
  <link rel="alternate icon" href="{{ bp }}/static/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,50&family=Inter:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ bp }}/static/css/app.css?v=3" />
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Saltar al contenido</a>
  {% block nav %}{% include "_nav.html" %}{% endblock %}
  {% block body %}{% endblock %}
  {% block footer %}{% include "_footer.html" %}{% endblock %}
  <script src="{{ bp }}/static/js/app.js?v=3"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
